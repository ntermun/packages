# pacman.conf for nnn.ntermun on Android (aarch64, static musl userland).
#
# Install path on the device:
#   /data/data/nnn.ntermun/files/etc/pacman.conf
# and run pacman with the app data directory as the root:
#   pacman --root /data/data/nnn.ntermun/files -Sy
#
# Packages install to /usr inside that root, i.e. <files>/usr, which is the
# $PREFIX the shell already uses.
#
# No signatures: the repository is rebuilt by CI from these sources and
# integrity is checked against the SHA256SUMS in the database.

[options]
Architecture = aarch64
SigLevel = Never
HoldPkg = pacman
CheckSpace = Never
CacheDir = /var/cache/pacman/pkg
DBPath = /var/lib/pacman
LogFile = /var/log/pacman.log
GPGDir = /etc/pacman.d/gnupg

[ntermun]
Server = https://ntermun.github.io/main-repo/aarch64
