#
# pacman configuration for the "nterminal" aarch64 repository.
#
# All packages are statically linked against musl and unsigned, therefore
# SigLevel = Never.  Only aarch64 is served.
#
# The database lives on GitHub Pages:
#   https://ntermun.github.io/main-repo/aarch64/nterminal.db.tar.gz
#
[options]
Architecture = aarch64
SigLevel = Never

[nterminal]
Server = https://ntermun.github.io/main-repo/aarch64
